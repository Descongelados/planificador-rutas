<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Planificador de Rutas Óptimas Multi-Destino</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <h1>Planificador de Rutas</h1>
    <p class="subtitle">Ordena tus destinos por la ruta más rápida y navega con Google Maps.</p>

    <section class="card">
      <label for="start">Punto de partida</label>
      <div class="row">
        <input id="start" type="text" placeholder="Ej: Plaza Mayor, Madrid" autocomplete="off">
        <button id="locate" type="button" class="secondary" title="Usar mi ubicación">📍</button>
      </div>

      <label for="destinations">Destinos (uno por línea)</label>
      <textarea id="destinations" rows="7" placeholder="Calle de Alcalá 50, Madrid&#10;Gran Vía 28, Madrid&#10;Paseo del Prado 1, Madrid"></textarea>

      <label class="check">
        <input id="roundtrip" type="checkbox"> Regresar al punto de partida
      </label>

      <button id="plan" type="button" class="primary">Calcular ruta óptima</button>
      <div id="status" class="status" role="status" aria-live="polite"></div>
    </section>

    <section id="result" class="card hidden">
      <h2>Ruta optimizada</h2>
      <p id="summary" class="summary"></p>
      <div id="warnings" class="warnings hidden"></div>
      <ol id="stops" class="stops"></ol>
      <div id="links" class="links"></div>
    </section>

    <footer>
      Datos de <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">© OpenStreetMap</a>
      · Geocodificación: Nominatim · Rutas: OSRM
    </footer>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
